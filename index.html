<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Conquer the Star</title>
<style>
:root{--bg:#05060f;--p1:#0d1226;--p2:#161d3a;--ln:#2a3566;--tx:#e8ecff;--mu:#8d97c4;--ac:#6ea8ff;--gd:#fbbf24;--gm:#5eead4;--rd:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;height:100dvh;margin:0 auto;position:relative;background:radial-gradient(ellipse at top,#121a3a,var(--bg) 70%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#0a0f20;border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.btn{background:linear-gradient(#3b5bdb,#2b3fa8);border:1px solid #6ea8ff55;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}.btn.gold{background:linear-gradient(#f59e0b,#b45309)}.btn.red{background:linear-gradient(#e11d48,#9f1239)}.btn.gray{background:#232b52}
.btn:disabled{opacity:.4;cursor:not-allowed}
#auth{height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px}
#auth h1{margin:0;text-align:center;font-size:34px;letter-spacing:1px;background:linear-gradient(90deg,#6ea8ff,#c084fc,#fbbf24);-webkit-background-clip:text;color:transparent}
#auth .sub{text-align:center;color:var(--mu);margin:0 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 6px;font-size:13px;white-space:nowrap}
.tabs button.on{background:#3b5bdb;border-color:#6ea8ff}
#authMsg{min-height:20px;text-align:center;color:#fca5a5;font-size:14px}
.foot{text-align:center;color:var(--mu);font-size:12px;padding:6px}
#game{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--p1);border-bottom:1px solid var(--ln)}
.av{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:var(--p2);font-size:28px;padding:0;flex:none}
.av span{position:absolute;right:-4px;bottom:-4px;background:#3b5bdb;border-radius:8px;font-size:11px;padding:1px 5px;border:1px solid #fff3}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo small{color:var(--mu);font-size:12px}
.bar{height:6px;background:#0a0f20;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6ea8ff,#c084fc);width:0}
.cur{display:flex;flex-direction:column;gap:2px;font-size:13px;text-align:right}
#stagebar{text-align:center;padding:5px;font-size:13px;color:var(--mu);background:#0a0f20}
#cvwrap{flex:1;min-height:180px;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%}
#skillbar{display:flex;gap:10px;justify-content:center;padding:8px;background:var(--p1)}
.sk{position:relative;width:58px;height:58px;border-radius:50%;background:var(--p2);border:2px solid var(--ln);font-size:26px;overflow:hidden;padding:0}
.sk .cdov{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.sk small{position:absolute;bottom:1px;left:0;right:0;font-size:9px}
#menu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:var(--p1);border-top:1px solid var(--ln)}
#menu button{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#menu button b{font-size:22px;font-weight:400}
#modal{position:absolute;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end}
#modal .box{width:100%;max-height:92%;background:var(--p1);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:17px}
.mh button{background:none;border:none;font-size:20px}
#mb{padding:12px;overflow-y:auto;flex:1}
.card{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-left:4px solid var(--rc,#999);border-radius:12px;padding:10px;margin-bottom:8px}
.card .ic{font-size:30px;width:44px;text-align:center;flex:none}.card .in{flex:1;min-width:0;font-size:13px}
.card .in b{font-size:14px}.card .in small{color:var(--mu);display:block}
.chip{display:inline-block;background:#0a0f20;border:1px solid var(--ln);border-radius:8px;padding:2px 6px;font-size:11px;margin:2px 3px 0 0}
.rb{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;color:#000;font-weight:700;margin-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{flex:none;background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:4px 10px;font-size:12px}
.chips button.on{background:#3b5bdb}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:13px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.avs button{font-size:24px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 0}.avs button.on{border-color:var(--gd)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row label{flex:0 0 38%;font-size:13px;color:var(--mu)}
h4{margin:12px 0 6px;color:var(--ac)}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#111a3acc;border:1px solid var(--ac);padding:8px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:.25s}
#toast.show{opacity:1}
.me{outline:2px solid var(--gd)}
</style>
</head>
<body>
<div id="app">

<section id="auth">
  <h1>⭐ Conquer the Star</h1>
  <p class="sub">Kultivasi, kumpulkan kekuatan, taklukkan bintang.</p>
  <div class="tabs"><button id="tabLogin" class="on">Masuk</button><button id="tabReg">Daftar</button></div>
  <input id="fUser" placeholder="Nama pemain (3-16 karakter)" autocomplete="username" hidden>
  <input id="fEmail" type="email" placeholder="Email" autocomplete="email">
  <input id="fPass" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password">
  <button id="btnAuth" class="btn">Masuk</button>
  <div id="authMsg"></div>
  <div class="foot">© SharkArt.evo Education</div>
</section>

<section id="game" hidden>
  <header id="top">
    <button id="avBtn" class="av">🥷<span id="lvBadge">1</span></button>
    <div class="pinfo"><b id="pName"></b><small id="pRealm"></small><div class="bar"><i id="expBar"></i></div></div>
    <div class="cur"><span>🪙 <b id="gold">0</b></span><span>💎 <b id="gems">0</b></span></div>
  </header>
  <div id="stagebar"></div>
  <div id="cvwrap"><canvas id="cv"></canvas></div>
  <div id="skillbar"></div>
  <nav id="menu">
    <button data-m="shop"><b>🛒</b>Toko</button>
    <button data-m="inv"><b>🎒</b>Penyimpanan</button>
    <button data-m="rank"><b>🏆</b>Peringkat</button>
    <button data-m="ach"><b>🎖️</b>Pencapaian</button>
    <button data-m="set"><b>⚙️</b>Pengaturan</button>
  </nav>
  <div class="foot">© SharkArt.evo Education</div>
</section>

<div id="modal" hidden><div class="box"><div class="mh"><b id="mt"></b><button id="mx">✕</button></div><div id="mb"></div></div></div>
<div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase)document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');</script>
<script>
/* ============ KONFIGURASI ============ */
const SUPABASE_URL = 'https://bpdafyjazyfgsqgpaerm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qvjLmpR-nlJsnnlSac3ahQ_QO3Qoeet';

const configured = !SUPABASE_URL.startsWith('GANTI');
let sb = null, initErr = '';
try {
  if (!window.supabase) throw new Error('Library Supabase gagal dimuat (cek koneksi internet / buka file ini lewat browser, bukan pratinjau).');
  if (configured) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) { initErr = e.message; }
window.addEventListener('error', e => { const m = $('#authMsg'); if (m) { m.textContent = 'Error: ' + e.message; } const a = $('#auth'); if (a && $('#game').hidden) a.hidden = false; });
window.addEventListener('unhandledrejection', e => { const m = $('#authMsg'); if (m) m.textContent = 'Error: ' + (e.reason?.message || e.reason); });
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Math.floor(Number(n) || 0); const a = [[1e12,'T'],[1e9,'B'],[1e6,'M']]; for (const [v,s] of a) if (n >= v) return (n/v).toFixed(2) + s; return n.toLocaleString('id-ID'); };

const RAR = ['basic','elite','special','epic','legend','mythic','ultimate','exclusive'];
const RCOL = {basic:'#9aa4b2',elite:'#4ade80',special:'#38bdf8',epic:'#a78bfa',legend:'#fbbf24',mythic:'#f43f5e',ultimate:'#f97316',exclusive:'#ff4de3'};
const EL = {
  api:{i:'🔥',n:'Api',d:'+% Damage',c:'#ff7a3d'}, air:{i:'💧',n:'Air',d:'+% HP',c:'#38bdf8'},
  tanah:{i:'🪨',n:'Tanah',d:'+% Defense',c:'#b08968'}, angin:{i:'🌪️',n:'Angin',d:'+% Kecepatan serang',c:'#9be7c4'},
  petir:{i:'⚡',n:'Petir',d:'+% Peluang kritis',c:'#facc15'}, tumbuhan:{i:'🌿',n:'Tumbuhan',d:'Regenerasi HP',c:'#4ade80'},
  logam:{i:'⚙️',n:'Logam',d:'-% Damage diterima',c:'#cbd5e1'}, es:{i:'❄️',n:'Es',d:'-% Serangan musuh',c:'#a5f3fc'},
  cahaya:{i:'✨',n:'Cahaya',d:'+% Gold',c:'#fde68a'}, void:{i:'🕳️',n:'Void',d:'+% Damage kritis',c:'#a855f7'},
  kegelapan:{i:'🌑',n:'Kegelapan',d:'% Lifesteal',c:'#6b21a8'}
};
const AVATARS = ['🥷','🧙','🤺','🦸','🧛','🧝','🥋','👑','🐉','⭐','🦊','🐺'];
const DEF_CFG = {realms:['Pemula Bela Diri','Prajurit Bela Diri','Panglima Perang','Dewa Perang','Tingkat Planet','Pengelana Bintang','Tingkat Bintang','Penguasa Domain','Penguasa Sektor','Penguasa Semesta','Tuan Semesta','Penakluk Bintang'],max_level:108,max_item_level:50,max_stat_level:100,gold_mult:1,exp_mult:1,upgrade_cost_mult:1};

const S = {user:null,P:null,items:{},inv:[],cfg:{...DEF_CFG},ach:[],claimed:new Set(),pending:{gold:0,exp:0,kills:0},stage:1,hs:null,syncing:false,lastL:1};

/* ============ UI UMUM ============ */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function modal(title,html){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').hidden=false;$('#mb').scrollTop=0;return $('#mb');}
function closeModal(){$('#modal').hidden=true;$('#mb').innerHTML='';}
$('#mx').onclick=closeModal;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
let AC;
function beep(f=440,d=.06,type='square',v=.03){
  if(S.P?.settings?.sfx===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
async function rpc(name,args){const {data,error}=await sb.rpc(name,args||{});if(error){toast(error.message);throw error;}return data;}

/* ============ RUMUS GAME ============ */
const need = L => Math.floor(80*Math.pow(L,1.7));
function curLevel(){let L=S.P.level,e=Number(S.P.exp)+S.pending.exp;const mx=S.cfg.max_level;while(L<mx&&e>=need(L)){e-=need(L);L++;}return{L,e};}
function realmOf(L){const r=S.cfg.realms;const i=Math.min(r.length-1,Math.floor((L-1)/9));return{i,name:r[i],s:((L-1)%9)+1};}
const invById = id => S.inv.find(x=>x.id===id);
const itemStat = (inv,k) => Math.round((S.items[inv.item_id][k]||0)*(1+0.25*(inv.level-1)));
function passiveTotals(){
  const eq=S.P.equipment||{},t={};
  for(const id of [eq.weapon,eq.armor]){const inv=id&&invById(id);if(!inv)continue;
    for(const p of inv.passives||[])t[p.el]=(t[p.el]||0)+p.pow*(1+0.05*(inv.level-1));}
  return t;
}
function heroStats(){
  const {L}=curLevel(),rm=realmOf(L),up=S.P.upgrades||{},eq=S.P.equipment||{};
  const w=eq.weapon&&invById(eq.weapon),a=eq.armor&&invById(eq.armor),pt=passiveTotals(),rb=1+0.25*rm.i;
  let atk=(10+L*4)*rb*(1+0.05*(up.atk||0))+(w?itemStat(w,'atk'):0);
  let hp=(100+L*30)*rb*(1+0.05*(up.hp||0))+(a?itemStat(a,'hp'):0);
  let def=(3+L*1.2)*rb*(1+0.05*(up.def||0))+(a?itemStat(a,'def'):0);
  atk*=1+(pt.api||0)/100;hp*=1+(pt.air||0)/100;def*=1+(pt.tanah||0)/100;
  const hs={L,atk,hp,def,pt,
    crit:Math.min(80,5+0.3*(up.crit||0)+(pt.petir||0)),critDmg:150+(pt.void||0),
    aspd:Math.min(3.5,1.2*(1+(pt.angin||0)/100)),regen:0.005+(pt.tumbuhan||0)*0.002,
    red:Math.min(60,pt.logam||0),weak:Math.min(60,pt.es||0),steal:Math.min(50,pt.kegelapan||0)/100,gold:1+(pt.cahaya||0)/100,
    wRar:w?S.items[w.item_id].rarity:null,aRar:a?S.items[a.item_id].rarity:null};
  hs.power=Math.floor(atk*3+hp*0.3+def*2);
  return hs;
}
function refreshStats(){S.hs=heroStats();if(B.hp>S.hs.hp)B.hp=S.hs.hp;}
const upCost = (inv) => {const it=S.items[inv.item_id];const base=it.currency==='gold'?it.price:it.price*1000;return Math.max(1,Math.floor(base*0.1*Math.pow(inv.level,1.4)*S.cfg.upgrade_cost_mult));};
const statCost = lvl => Math.floor(100*Math.pow(1.15,lvl)*S.cfg.upgrade_cost_mult);
const rbadge = r => `<span class="rb" style="background:${RCOL[r]}">${r.toUpperCase()}</span>`;
const passChips = ps => (ps||[]).map(p=>`<span class="chip" style="border-color:${EL[p.el]?.c}">${EL[p.el]?.i} ${EL[p.el]?.n} ${(p.pow).toFixed(1)}%</span>`).join('');
function itemStatsTxt(it,lvl=1){
  const m=1+0.25*(lvl-1),o=[];
  if(it.atk)o.push('⚔️ '+Math.round(it.atk*m));if(it.hp)o.push('❤️ '+Math.round(it.hp*m));if(it.def)o.push('🛡️ '+Math.round(it.def*m));
  if(it.type==='skill')o.push(`${EL[it.element]?.i||''} x${(it.skill_mult*(1+0.2*(lvl-1))).toFixed(2)} dmg • CD ${it.cooldown}s`);
  return o.join('  ');
}

/* ============ AUTH ============ */
let regMode=false;
function setMode(r){regMode=r;$('#tabLogin').classList.toggle('on',!r);$('#tabReg').classList.toggle('on',r);$('#fUser').hidden=!r;$('#btnAuth').textContent=r?'Daftar & Main':'Masuk';$('#authMsg').textContent='';}
$('#tabLogin').onclick=()=>setMode(false);$('#tabReg').onclick=()=>setMode(true);
function showAuth(msg){$('#game').hidden=true;$('#auth').hidden=false;$('#authMsg').textContent=msg||'';}
$('#btnAuth').onclick=async()=>{
  if(!configured)return showAuth('Isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html lalu muat ulang.');
  const email=$('#fEmail').value.trim(),password=$('#fPass').value,username=$('#fUser').value.trim();
  if(!email||password.length<6)return $('#authMsg').textContent='Isi email dan kata sandi (min. 6 karakter).';
  if(regMode&&!/^[A-Za-z0-9_ ]{3,16}$/.test(username))return $('#authMsg').textContent='Nama 3-16 karakter: huruf, angka, spasi, _';
  $('#btnAuth').disabled=true;$('#authMsg').textContent='Memproses...';
  try{
    let res;
    if(regMode){res=await sb.auth.signUp({email,password,options:{data:{username}}});
      if(!res.error&&!res.data.session){$('#btnAuth').disabled=false;return $('#authMsg').textContent='Akun dibuat. Cek email untuk konfirmasi, lalu masuk.';}}
    else res=await sb.auth.signInWithPassword({email,password});
    if(res.error)throw res.error;
    S.user=res.data.user||res.data.session.user;await enter();
  }catch(e){$('#authMsg').textContent=e.message||'Gagal';}
  $('#btnAuth').disabled=false;
};

/* ============ MUAT DATA ============ */
async function loadAll(){
  const uid=S.user.id;
  const [p,it,inv,cf,ac,ua]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('items').select('*'),
    sb.from('inventory').select('*').eq('user_id',uid).order('created_at'),
    sb.from('game_config').select('*'),
    sb.from('achievements').select('*').eq('enabled',true).order('target'),
    sb.from('user_achievements').select('ach_id').eq('user_id',uid)]);
  for(const r of [p,it,inv,cf,ac,ua])if(r.error)throw r.error;
  S.P=p.data;S.items={};it.data.forEach(i=>S.items[i.id]=i);S.inv=inv.data;
  S.cfg={...DEF_CFG};cf.data.forEach(r=>S.cfg[r.key]=r.value);
  S.ach=ac.data;S.claimed=new Set(ua.data.map(x=>x.ach_id));
}
async function refreshProfile(){const {data,error}=await sb.from('profiles').select('*').eq('id',S.user.id).single();if(!error){S.P=data;refreshStats();hud();}}
async function refreshInv(){const {data,error}=await sb.from('inventory').select('*').eq('user_id',S.user.id).order('created_at');if(!error){S.inv=data;refreshStats();renderSkillBar();}}

async function enter(){
  try{await loadAll();}catch(e){return showAuth('Gagal memuat data: '+(e.message||e)+' (pastikan supabase.sql sudah dijalankan)');}
  if(S.P.banned){await sb.auth.signOut();return showAuth('Akun ini diblokir admin.');}
  $('#auth').hidden=true;$('#game').hidden=false;
  S.stage=S.P.stage;S.lastL=S.P.level;B.k=0;resize();refreshStats();B.hp=S.hs.hp;spawn();renderSkillBar();hud();
  if(!loopOn){loopOn=true;last=performance.now();requestAnimationFrame(loop);}
  try{const o=await rpc('claim_offline');if(o&&o.secs>0){await refreshProfile();
    modal('Selamat datang kembali!',`<p>Pasukanmu bertahan <b>${Math.floor(o.secs/60)} menit</b> saat kamu pergi.</p><p>🪙 +${fmt(o.gold)} Gold<br>⭐ +${fmt(o.exp)} EXP</p><button class="btn" style="width:100%" onclick="closeModal()">Lanjutkan</button>`);}}catch(e){}
}

/* ============ SINKRONISASI ============ */
async function sync(){
  while(S.syncing)await sleep(80);
  if(!S.P)return;const sn={...S.pending};
  if(!sn.gold&&!sn.exp&&!sn.kills&&S.stage===S.P.stage)return;
  S.syncing=true;S.pending={gold:0,exp:0,kills:0};
  const {data,error}=await sb.rpc('save_progress',{p_exp:sn.exp,p_gold:sn.gold,p_kills:sn.kills,p_stage:S.stage});
  S.syncing=false;
  if(error){S.pending.gold+=sn.gold;S.pending.exp+=sn.exp;S.pending.kills+=sn.kills;return;}
  S.P=data;hud();
}
setInterval(()=>{if(S.P)sync();},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)sync();});
window.addEventListener('pagehide',()=>{sync();});

/* ============ HUD ============ */
function hud(){
  if(!S.P)return;const {L,e}=curLevel(),rm=realmOf(L);
  $('#avBtn').firstChild.nodeValue=S.P.avatar;$('#lvBadge').textContent=L;
  $('#pName').textContent=S.P.username;$('#pRealm').textContent=`${rm.name} • Tingkat ${rm.s}`;
  $('#expBar').style.width=(L>=S.cfg.max_level?100:Math.min(100,e/need(L)*100))+'%';
  $('#gold').textContent=fmt(Number(S.P.gold)+S.pending.gold);$('#gems').textContent=fmt(S.P.gems);
  const boss=S.stage%10===0;$('#stagebar').textContent=`Stage ${S.stage}${boss?' 👹 BOSS':''}  •  Musuh ${Math.min(B.k+1,5)}/5  •  Power ${fmt(S.hs?.power||0)}`;
  if(L>S.lastL){const o=realmOf(S.lastL);toast(o.i<rm.i?`🌟 Menembus ke ${rm.name}!`:`⬆️ Naik level ${L}!`);beep(880,.2,'triangle',.05);S.lastL=L;refreshStats();}
}

/* ============ PERTEMPURAN ============ */
const B={hp:1,enemy:null,k:0,aT:0,eT:0,cd:[0,0,0],fx:[],t:0,spawnT:0,hitFlash:0,heroSw:0,eSw:0,scroll:0};
const cv=$('#cv'),cx=cv.getContext('2d');let W=300,Hh=300,loopOn=false,last=0,stars=[];
function resize(){const r=$('#cvwrap').getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,S.P?.settings?.quality==='low'?1:2);W=r.width;Hh=r.height;cv.width=W*dpr;cv.height=Hh*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:S.P?.settings?.quality==='low'?25:70},()=>({x:Math.random()*W,y:Math.random()*Hh*.7,s:Math.random()*1.8+.4,v:Math.random()*8+3}));}
window.addEventListener('resize',resize);

function spawn(){
  const s=S.stage,boss=s%10===0&&B.k===4;
  B.enemy={x:W+40,boss,maxHp:(20*Math.pow(s,1.3)+10)*(boss?6:1),atk:(2+Math.pow(s,1.2)*1.2)*(boss?1.5:1),
    gold:Math.floor((4+Math.pow(s,1.4)*1.5)*(boss?8:1)*S.cfg.gold_mult),exp:Math.floor((3+Math.pow(s,1.3))*(boss?8:1)*S.cfg.exp_mult),col:boss?'#f43f5e':['#ef4444','#f97316','#a855f7','#22d3ee'][s%4]};
  B.enemy.hp=B.enemy.maxHp;B.aT=0;B.eT=0;
}
function fxText(x,y,txt,col,big){B.fx.push({k:'t',x,y,txt,col,life:.9,big});}
function skillInv(i){const id=(S.P.equipment?.skills||[])[i];return id?invById(id):null;}
function dealDamage(d,col,crit){
  const e=B.enemy;if(!e)return;e.hp-=d;fxText(e.x,Hh*.62-70-Math.random()*20,(crit?'💥':'')+fmt(d),col||'#fff',crit);
  if(S.hs.steal>0)B.hp=Math.min(S.hs.hp,B.hp+d*S.hs.steal);
  if(e.hp<=0){
    const g=Math.floor(e.gold*S.hs.gold);S.pending.gold+=g;S.pending.exp+=e.exp;S.pending.kills++;
    fxText(e.x,Hh*.62-90,'+'+fmt(g)+'🪙','#fbbf24');B.fx.push({k:'r',x:e.x,y:Hh*.62-30,r:5,life:.4,col:e.col});
    B.enemy=null;B.k++;beep(300,.08,'sawtooth');
    if(B.k>=5){S.stage++;B.k=0;}
    B.spawnT=.35;hud();
  }
}
function castSkill(i){
  const inv=skillInv(i);if(!inv||B.cd[i]>0||!B.enemy)return;const it=S.items[inv.item_id];
  const d=Math.floor(S.hs.atk*it.skill_mult*(1+0.2*(inv.level-1))*(0.95+Math.random()*.1));
  B.cd[i]=Number(it.cooldown);B.heroSw=1;B.fx.push({k:'r',x:B.enemy.x,y:Hh*.62-30,r:10,life:.5,col:EL[it.element]?.c||'#fff',big:1});
  beep(600,.15,'triangle',.05);dealDamage(d,EL[it.element]?.c,true);
}
function update(dt){
  if(!S.hs)return;B.t+=dt;B.scroll+=dt*(B.enemy&&B.enemy.x<=W*.3+110?0:60);
  const H=S.hs;B.hp=Math.min(H.hp,B.hp+H.hp*H.regen*dt);B.heroSw=Math.max(0,B.heroSw-dt*4);B.eSw=Math.max(0,B.eSw-dt*4);
  for(let i=0;i<3;i++)if(B.cd[i]>0)B.cd[i]-=dt;
  const hx=W*.3;
  if(!B.enemy){B.spawnT-=dt;if(B.spawnT<=0)spawn();}
  else{
    const e=B.enemy,engaged=e.x-hx<110;
    if(!engaged)e.x-=dt*120;else e.x=Math.max(e.x-dt*30,hx+95);
    if(engaged){
      B.aT+=dt;if(B.aT>=1/H.aspd){B.aT=0;B.heroSw=1;const crit=Math.random()*100<H.crit;
        let d=H.atk*(0.9+Math.random()*.2);if(crit)d*=H.critDmg/100;d=Math.max(1,Math.floor(d));beep(crit?520:260,.04);dealDamage(d,crit?'#fde047':'#fff',crit);}
      for(let i=0;i<3;i++)if(B.cd[i]<=0&&B.enemy)castSkill(i);
      if(B.enemy){B.eT+=dt;if(B.eT>=1.3){B.eT=0;B.eSw=1;
        const d=Math.max(1,Math.floor(B.enemy.atk*(1-H.weak/100)*(1-H.red/100)-H.def*0.6));B.hp-=d;B.hitFlash=.25;fxText(hx,Hh*.62-80,'-'+d,'#f87171');
        if(B.hp<=0){S.stage=Math.max(1,S.stage-1);B.k=0;B.hp=H.hp;B.enemy=null;B.spawnT=.8;toast('💀 Kamu kalah! Kembali ke stage '+S.stage);}}}
    }
  }
  B.hitFlash=Math.max(0,B.hitFlash-dt);
  B.fx.forEach(f=>{f.life-=dt;if(f.k==='t')f.y-=dt*40;else f.r+=dt*(f.big?260:120);});B.fx=B.fx.filter(f=>f.life>0);
  hudT-=dt;if(hudT<=0){hudT=.25;hud();updCd();}
  hsT-=dt;if(hsT<=0){hsT=1;refreshStats();}
}
let hudT=0,hsT=0;

function stick(x,y,sc,col,o){
  const run=o.run?Math.sin(B.t*12):0,hy=y-52*sc,d=o.dir,sw=o.sw||0;
  cx.lineCap='round';cx.lineWidth=3*sc;cx.strokeStyle=col;
  cx.beginPath();cx.moveTo(x,y-26*sc);cx.lineTo(x+run*10*sc,y);cx.moveTo(x,y-26*sc);cx.lineTo(x-run*10*sc,y);cx.stroke();
  if(o.body){cx.strokeStyle=o.body;cx.lineWidth=6*sc;cx.shadowColor=o.body;cx.shadowBlur=8;}
  cx.beginPath();cx.moveTo(x,hy+10*sc);cx.lineTo(x,y-26*sc);cx.stroke();cx.shadowBlur=0;
  cx.strokeStyle=col;cx.lineWidth=3*sc;
  const hx2=x+d*(10+sw*16)*sc,hy2=hy+22*sc-sw*10*sc;
  cx.beginPath();cx.moveTo(x,hy+18*sc);cx.lineTo(hx2,hy2);cx.moveTo(x,hy+18*sc);cx.lineTo(x-d*8*sc,hy+30*sc+run*4*sc);cx.stroke();
  cx.beginPath();cx.arc(x,hy,10*sc,0,7);cx.fillStyle='#0b0f1e';cx.fill();cx.stroke();
  if(o.weapon){const a=-1.1+sw*1.9,L=(o.wl||30)*sc;cx.strokeStyle=o.weapon;cx.lineWidth=3.5*sc;cx.shadowColor=o.weapon;cx.shadowBlur=10;
    cx.beginPath();cx.moveTo(hx2,hy2);cx.lineTo(hx2+Math.cos(a)*L*d,hy2+Math.sin(a)*L);cx.stroke();cx.shadowBlur=0;}
  if(o.horns){cx.fillStyle=col;cx.beginPath();cx.moveTo(x-8*sc,hy-6*sc);cx.lineTo(x-5*sc,hy-18*sc);cx.lineTo(x-1*sc,hy-9*sc);cx.moveTo(x+8*sc,hy-6*sc);cx.lineTo(x+5*sc,hy-18*sc);cx.lineTo(x+1*sc,hy-9*sc);cx.fill();}
  if(o.eyes){cx.fillStyle='#fecaca';cx.fillRect(x-4*sc,hy-2*sc,2.5*sc,2.5*sc);cx.fillRect(x+2*sc,hy-2*sc,2.5*sc,2.5*sc);}
}
function bar(x,y,w,p,col){cx.fillStyle='#000a';cx.fillRect(x-w/2,y,w,6);cx.fillStyle=col;cx.fillRect(x-w/2,y,w*Math.max(0,Math.min(1,p)),6);}
function draw(){
  const g=cx.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#070a1f');g.addColorStop(1,'#1a1240');cx.fillStyle=g;cx.fillRect(0,0,W,Hh);
  cx.fillStyle='#fff';for(const s of stars){const x=((s.x-B.scroll*s.v/60)%W+W)%W;cx.globalAlpha=.4+.6*Math.abs(Math.sin(B.t+s.x));cx.fillRect(x,s.y,s.s,s.s);}cx.globalAlpha=1;
  const gy=Hh*.62;cx.fillStyle='#10152e';cx.fillRect(0,gy,W,Hh-gy);cx.strokeStyle='#2a3566';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke();
  cx.strokeStyle='#1c2448';for(let i=0;i<14;i++){const x=((i*60-B.scroll)%(W+60)+W+60)%(W+60);cx.beginPath();cx.moveTo(x,gy+4);cx.lineTo(x-20,Hh);cx.stroke();}
  if(!S.hs)return;const hx=W*.3,H=S.hs;
  const moving=!B.enemy||B.enemy.x-hx>=110;
  stick(hx,gy,1.25,B.hitFlash>0?'#f87171':'#e8ecff',{dir:1,run:moving,sw:B.heroSw,body:H.aRar?RCOL[H.aRar]:null,weapon:H.wRar?RCOL[H.wRar]:'#9aa4b2',wl:34});
  bar(hx,gy-110,64,B.hp/H.hp,'#4ade80');
  if(B.enemy){const e=B.enemy,sc=e.boss?2:1.1;stick(e.x,gy,sc,e.col,{dir:-1,run:e.x-hx>=110,sw:B.eSw,horns:true,eyes:true,weapon:e.boss?'#fb7185':null,wl:26});
    bar(e.x,gy-(e.boss?120:75)*(e.boss?1.05:1.1),e.boss?90:50,e.hp/e.maxHp,'#f43f5e');}
  for(const f of B.fx){cx.globalAlpha=Math.min(1,f.life*2);
    if(f.k==='t'){cx.font=`bold ${f.big?20:14}px system-ui`;cx.fillStyle=f.col;cx.textAlign='center';cx.fillText(f.txt,f.x,f.y);}
    else{cx.strokeStyle=f.col;cx.lineWidth=f.big?6:3;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.stroke();}}
  cx.globalAlpha=1;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(S.P&&!$('#game').hidden){update(dt);draw();}requestAnimationFrame(loop);}

function renderSkillBar(){
  const bar=$('#skillbar');bar.innerHTML='';
  for(let i=0;i<3;i++){const inv=skillInv(i),b=document.createElement('button');b.className='sk';
    if(inv){const it=S.items[inv.item_id];b.style.borderColor=RCOL[it.rarity];b.innerHTML=`${it.icon}<div class="cdov"></div><small>Lv${inv.level}</small>`;b.onclick=()=>castSkill(i);}
    else{b.innerHTML='<span style="color:#556;font-size:18px">+</span>';b.onclick=()=>openInv('skill');}
    bar.appendChild(b);}
}
function updCd(){document.querySelectorAll('#skillbar .sk').forEach((b,i)=>{const inv=skillInv(i);const o=b.querySelector('.cdov');if(!inv||!o)return;const it=S.items[inv.item_id];o.style.height=Math.max(0,B.cd[i]/it.cooldown*100)+'%';});}

    return`<div class="card" style="--rc:${done?'#4ade80':ok?'#fbbf24':'#556'}"><div class="ic">${done?'✅':ok?'🎁':'🎖️'}</div><div class="in"><b>${esc(a.name)}</b><small>${esc(a.descr)}</small>
    <div class="bar"><i style="width:${Math.min(100,v/a.target*100)}%"></i></div><small>${fmt(Math.min(v,a.target))}/${fmt(a.target)} • 🪙${fmt(a.reward_gold)} 💎${fmt(a.reward_gems)}</small></div>
    <button class="btn sm gold" data-c="${a.id}" ${(!ok||done)?'disabled':''}>${done?'Selesai':'Klaim'}</button></div>`}).join('')||'<p>Belum ada pencapaian.</p>');
  b.querySelectorAll('[data-c]').forEach(x=>x.onclick=async()=>{await sync();try{S.P=await rpc('claim_achievement',{p_id:x.dataset.c});S.claimed.add(x.dataset.c);hud();beep(900,.2,'triangle');toast('Hadiah diterima!');openAch();}catch(e){}});
}

/* ---- Pengaturan ---- */
function openSettings(){
  const st=S.P.settings||{};
  const b=modal('Pengaturan',`
    <div class="row"><label>Efek suara</label><select id="sSfx"><option value="1" ${st.sfx!==false?'selected':''}>Hidup</option><option value="0" ${st.sfx===false?'selected':''}>Mati</option></select></div>
    <div class="row"><label>Kualitas grafis</label><select id="sQ"><option value="high" ${st.quality!=='low'?'selected':''}>Tinggi</option><option value="low" ${st.quality==='low'?'selected':''}>Hemat baterai</option></select></div>
    <button class="btn" id="sSave" style="width:100%;margin-top:8px">Simpan pengaturan</button>
    <h4>Ganti nama</h4><div class="row"><input id="sName" value="${esc(S.P.username)}" maxlength="16"><button class="btn sm" id="sNameBtn" style="flex:0 0 auto">Ubah</button></div>
    ${S.P.is_admin?'<button class="btn gold" id="sAdm" style="width:100%;margin-top:10px">🛠️ Panel Admin</button>':''}
    <button class="btn red" id="sOut" style="width:100%;margin-top:10px">Keluar</button>
    <p style="text-align:center;color:var(--mu);font-size:12px;margin-top:14px">Conquer the Star<br>© SharkArt.evo Education</p>`);
  $('#sSave').onclick=async()=>{try{S.P=await rpc('update_profile_info',{p_settings:{...st,sfx:$('#sSfx').value==='1',quality:$('#sQ').value}});resize();toast('Tersimpan');}catch(e){}};
  $('#sNameBtn').onclick=async()=>{try{S.P=await rpc('update_profile_info',{p_username:$('#sName').value.trim()});hud();toast('Nama diubah');}catch(e){}};
  $('#sOut').onclick=async()=>{await sync();await sb.auth.signOut();S.P=null;closeModal();showAuth('Kamu telah keluar.');};
  if(S.P.is_admin)$('#sAdm').onclick=openAdmin;
}

/* ============ ADMIN ============ */
const ADM={
  profiles:{pk:'id',order:'level',desc:true,noNew:true,noDel:true,cols:[['username','text'],['avatar','text'],['level','int'],['exp','int'],['gold','int'],['gems','int'],['stage','int'],['best_stage','int'],['kills','int'],['upgrades','json'],['is_admin','bool'],['banned','bool']],title:r=>`${r.avatar} ${r.username} (Lv${r.level})`},
  items:{pk:'id',order:'sort',cols:[['id','text'],['type','sel:weapon,armor,skill'],['name','text'],['rarity','sel:'+RAR.join(',')],['icon','text'],['element','text'],['atk','int'],['hp','int'],['def','int'],['skill_mult','num'],['cooldown','num'],['price','int'],['currency','sel:gold,gems'],['enabled','bool'],['sort','int']],title:r=>`${r.icon} ${r.name} [${r.type}/${r.rarity}]`},
  achievements:{pk:'id',order:'target',cols:[['id','text'],['name','text'],['descr','text'],['metric','sel:kills,stage,level,items'],['target','int'],['reward_gold','int'],['reward_gems','int'],['enabled','bool']],title:r=>`${r.name} (${r.metric}≥${r.target})`},
  game_config:{pk:'key',order:'key',cols:[['key','text'],['value','json']],title:r=>`${r.key} = ${JSON.stringify(r.value).slice(0,40)}`}
};
function openAdmin(tab='profiles'){
  const names={profiles:'Pemain',items:'Barang',achievements:'Pencapaian',game_config:'Konfigurasi',grant:'Beri Item'};
  const b=modal('Panel Admin',`<div class="tabs">${Object.entries(names).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('')}</div><div id="adBody"></div>`);
  b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>openAdmin(x.dataset.t));
  tab==='grant'?adminGrant():adminList(tab);
}
async function adminList(t,q=''){
  const c=ADM[t],box=$('#adBody');box.innerHTML='<p>Memuat...</p>';
  const {data,error}=await sb.from(t).select('*').order(c.order,{ascending:!c.desc}).limit(300);
  if(error){box.innerHTML='<p>'+esc(error.message)+'</p>';return;}
  box.innerHTML=`<div class="row"><input id="adQ" placeholder="Cari..." value="${esc(q)}">${c.noNew?'':'<button class="btn sm" id="adNew" style="flex:0 0 auto">+ Baru</button>'}</div>`+
    data.filter(r=>c.title(r).toLowerCase().includes(q.toLowerCase())).map((r,i)=>`<div class="card" style="--rc:#556"><div class="in"><b>${esc(c.title(r))}</b></div><button class="btn sm" data-e="${esc(r[c.pk])}">Edit</button></div>`).join('');
  $('#adQ').oninput=e=>adminList(t,e.target.value);
  box.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>adminForm(t,data.find(r=>String(r[c.pk])===x.dataset.e)));
  if($('#adNew'))$('#adNew').onclick=()=>adminForm(t,null);
}
function adminForm(t,row){
  const c=ADM[t],isNew=!row,box=$('#adBody');
  box.innerHTML=c.cols.map(([k,ty])=>{
    const v=row?row[k]:(ty==='bool'?true:ty==='json'?'{}':'');const ro=!isNew&&k===c.pk;let f;
    if(ty==='bool')f=`<select data-k="${k}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
    else if(ty.startsWith('sel:'))f=`<select data-k="${k}">${ty.slice(4).split(',').map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(ty==='json')f=`<textarea data-k="${k}" rows="3">${esc(typeof v==='string'?v:JSON.stringify(v))}</textarea>`;
    else f=`<input data-k="${k}" type="${ty==='text'?'text':'number'}" step="any" value="${esc(v??'')}" ${ro?'disabled':''}>`;
    return`<div class="row"><label>${k}</label>${f}</div>`}).join('')+
    `<div class="row"><button class="btn" id="afS">Simpan</button>${(!isNew&&!c.noDel)?'<button class="btn red" id="afD">Hapus</button>':''}<button class="btn gray" id="afC">Batal</button></div>`;
  $('#afC').onclick=()=>adminList(t);
  $('#afS').onclick=async()=>{
    const o={};try{c.cols.forEach(([k,ty])=>{const el=box.querySelector(`[data-k="${k}"]`);let v=el.value;
      if(ty==='bool')v=v==='true';else if(ty==='int'||ty==='num')v=Number(v);else if(ty==='json')v=JSON.parse(v);else if(v===''&&k==='element')v=null;o[k]=v;});}catch(e){return toast('Format tidak valid: '+e.message);}
    let r;if(t==='profiles'){delete o.id;r=await sb.from(t).update(o).eq('id',row.id);}else r=await sb.from(t).upsert(o);
    if(r.error)return toast(r.error.message);toast('Tersimpan');
    if(t==='profiles'&&row.id===S.user.id)await refreshProfile();else if(t!=='profiles')await loadAll().then(()=>{refreshStats();renderSkillBar();hud();});
    adminList(t);};
  if($('#afD'))$('#afD').onclick=async()=>{if(!confirm('Hapus data ini?'))return;const r=await sb.from(t).delete().eq(c.pk,row[c.pk]);if(r.error)return toast(r.error.message);toast('Dihapus');await loadAll();adminList(t);};
}
async function adminGrant(){
  const box=$('#adBody');
  const {data}=await sb.from('profiles').select('id,username').order('username').limit(300);
  box.innerHTML=`<div class="row"><label>Pemain</label><select id="gU">${(data||[]).map(p=>`<option value="${p.id}">${esc(p.username)}</option>`).join('')}</select></div>
  <div class="row"><label>Barang</label><select id="gI">${Object.values(S.items).sort((a,b)=>a.type.localeCompare(b.type)||RAR.indexOf(a.rarity)-RAR.indexOf(b.rarity)).map(i=>`<option value="${i.id}">${esc(i.name)} [${i.type}/${i.rarity}]</option>`).join('')}</select></div>
  <button class="btn" id="gB" style="width:100%">Beri barang</button>`;
  $('#gB').onclick=async()=>{try{await rpc('admin_grant_item',{p_user:$('#gU').value,p_item:$('#gI').value});toast('Barang diberikan');if($('#gU').value===S.user.id)refreshInv();}catch(e){}};
}

/* ============ MULAI ============ */
(async function boot(){
  showAuth(initErr);
  if(initErr||!sb)return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){S.user=session.user;await enter();}
  }catch(e){showAuth('Gagal memulai: '+(e.message||e));}
})();
</script>
